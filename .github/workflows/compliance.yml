name: Compliance regression

on:
  push:
    branches: ['codex/compliance-preserve-behaviour', 'codex/compliance-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: false

env:
  BASELINE_SHA: 4ad2cc42595722cedb47102e4343298339040d40
  PICO_SDK_SHA: 98a542c1a62fb549ffb5d66a3e5892b06276b670
  PYTHONUNBUFFERED: '1'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Bounded alias audit reads its recorded historical baseline.
      - name: Install exact audit tools
        run: |
          /usr/bin/python3 tools/compliance/install_host.py --formatter
          /usr/bin/python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/clang-audit" libclang==18.1.1
      - name: Record all audits, including unresolved review gates
        run: CR1_REQUIRE_LIBCLANG=1 PYTHONPATH="$RUNNER_TEMP/clang-audit" /usr/bin/python3 tools/compliance/static_report.py --output evidence
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
        mode: [gcc, clang, sanitize]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ matrix.revision == 'baseline' && env.BASELINE_SHA || github.sha }}
          path: subject
          persist-credentials: false
      - name: Install host dependencies
        run: /usr/bin/python3 tooling/tools/compliance/install_host.py
      - name: Execute host suites
        run: /usr/bin/python3 tooling/tools/compliance/run_host.py --root subject --output evidence --mode '${{ matrix.mode }}' ${{ matrix.revision == 'candidate' && '--check-c99' || '' }}
      - name: Observe host conditional compilation
        if: always() && matrix.revision == 'candidate' && matrix.mode != 'sanitize'
        run: /usr/bin/python3 tooling/tools/compliance/conditional_coverage.py --root subject --commands evidence/compile_commands.jsonl --output evidence/conditional-coverage --profile 'host-${{ matrix.mode }}'
      - name: Save host branch receipt for matrix union
        if: always() && matrix.revision == 'candidate' && matrix.mode != 'sanitize'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: branches-host-${{ matrix.mode }}-${{ github.sha }}
          path: evidence/conditional-coverage/results.json
          if-no-files-found: error
      - name: Save execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-${{ matrix.revision }}-${{ matrix.mode }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - run: /usr/bin/python3 candidate/tools/compliance/install_host.py
      - name: Compare actual semantic outputs
        run: /usr/bin/python3 candidate/tools/compliance/differential.py --baseline baseline --candidate candidate --output evidence
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [production, diagnostics, imu_debug, offline_motion, stationary_1, stationary_3, self_tests, motion_smoke, s4_bench, single_core, straight_test, s5_unconfirmed]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_SHA }}
          path: pico-sdk
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Arm compiler
        run: |
          /usr/bin/python3 candidate/tools/compliance/install_host.py
          bash candidate/tools/compliance/install_arm.sh "$RUNNER_TEMP/arm"
      - name: Build identical baseline and candidate profiles
        run: /usr/bin/python3 candidate/tools/compliance/build_targets.py --baseline baseline --candidate candidate --sdk pico-sdk --profile '${{ matrix.profile }}' --output evidence
      - name: Observe target conditional compilation
        if: success()
        run: /usr/bin/python3 candidate/tools/compliance/conditional_coverage.py --root candidate --commands evidence/candidate/compile_commands.json --output evidence/conditional-coverage --profile 'target-${{ matrix.profile }}'
      - name: Save target branch receipt for matrix union
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: branches-target-${{ matrix.profile }}-${{ github.sha }}
          path: evidence/conditional-coverage/results.json
          if-no-files-found: error
      - name: Collect compiler observations (partial diagnostics remain explicit)
        if: matrix.profile == 'production' && success()
        run: |
          /usr/bin/python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/clang-bindings" libclang==18.1.1
          PYTHONPATH="$RUNNER_TEMP/clang-bindings" /usr/bin/python3 candidate/testing/compliance/inventory_ast.py --root candidate --compile-db evidence/candidate/compile_commands.json --output evidence/inventory-ast.json --jobs 4
          PYTHONPATH="$RUNNER_TEMP/clang-bindings" /usr/bin/python3 candidate/tools/compliance/barr_functions.py --compile-db evidence/candidate/compile_commands.json --output evidence/function-inventory.json --jobs 4
      - name: Save compiler function observations for documentation comparison
        if: always() && matrix.profile == 'production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: function-inventory-${{ github.sha }}
          path: evidence/function-inventory.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: target-${{ matrix.profile }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  documentation:
    runs-on: ubuntu-24.04
    needs: [target]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: /usr/bin/python3 tools/compliance/install_host.py --documentation
      - name: Download this revision's compiler function inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: function-inventory-${{ github.sha }}
          path: compiler-evidence
      - name: Generate owned source documentation and retain all warnings
        if: always()
        run: /usr/bin/python3 tools/compliance/build_docs.py --function-report compiler-evidence/function-inventory.json --output evidence
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  conditional-union:
    runs-on: ubuntu-24.04
    needs: [host, target]
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: /usr/bin/python3 tools/compliance/install_host.py
      - name: Download this run's separate branch receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: branches-*-${{ github.sha }}
          path: branch-receipts
          merge-multiple: false
      - name: Require complete matching profile and source coverage
        if: always()
        run: /usr/bin/python3 tools/compliance/coverage_union.py --receipts branch-receipts --output evidence
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conditional-union-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

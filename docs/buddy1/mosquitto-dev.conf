# Development MQTT broker config — INF2004 robot car, Buddy 1
#
# Mosquitto 2.x defaults to localhost-only + no anonymous clients, which would
# silently reject the Pico. This config opens it up for lab use.
#
# DEV ONLY. No authentication, no encryption. Only run this on your own
# machine on a personal hotspot — never on a shared or campus network.
#
# Run it with:
#   mosquitto -c docs/buddy1/mosquitto-dev.conf -v
#
# -v is verbose: it prints every connection and every message, which is the
# single most useful debugging tool you have while bringing the Pico up.

# Listen on the standard MQTT port, on every network interface, so the Pico
# can reach us over WiFi (not just programs on this laptop).
listener 1883 0.0.0.0

# Allow clients to connect without a username or password.
allow_anonymous true

# Keep everything in memory; no on-disk message database to get stale.
persistence false
